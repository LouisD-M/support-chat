name: Publish Support Chat Desktop

on:
  workflow_dispatch:

jobs:
  publish-client:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish desktop application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          projectPath: apps/client

          tagName: support-chat-v__VERSION__
          releaseName: "Support Chat v__VERSION__"

          releaseBody: |
            Version portable de Support Chat.

            Téléchargez le fichier app.exe et lancez-le directement.
            Aucune installation n’est nécessaire.

          releaseDraft: false
          prerelease: false

          uploadPlainBinary: true